<!DOCTYPE html>
<html> <head>
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    <script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.js"></script>
<title>IT Devices AR</title> </head>
  <body>
  <a-scene arjs="debugUIEnabled: false">
    <a-assets>
	     <a-asset-item id="zweier"  src="lego-2er.gltf">
            </a-asset-item>
    </a-assets>    
    <a-marker preset="hiro">
         <a-entity gltf-model="#zweier" scale="0.01 0.01 0.01" rotation="-90 -90 90" position="0 0 0"></a-entity>
      </a-marker>
      <a-entity gltf-model="#zweier"  scale="0.1 0.1 0.1" rotation="-90 -90 90"></a-entity>
    </a-marker-camera>
<a-entity camera></a-entity> 
</a-scene>
</body>
</html>
